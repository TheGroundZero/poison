---
name: Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Load super-linter configuration
        # Ref: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-environment-variable
        run: grep -v '^#' .github/super-linter.env >> "$GITHUB_ENV"
        
      - name: Cache super-linter image
        id: super-linter-cache
        uses: actions/cache@v4
        with:
          path: /tmp/super-linter.tar
          key: super-linter-slim-v8-${{ runner.os }}

      - name: Load cached super-linter image
        if: steps.super-linter-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/super-linter.tar

      - name: Download and cache super-linter image
        if: steps.super-linter-cache.outputs.cache-hit != 'true'
        run: |
          docker pull super-linter/super-linter:slim-v8
          docker save --output /tmp/super-linter.tar super-linter/super-linter:slim-v8

      - name: Super-linter
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.ref_name != github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "chore: fix linting issues"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev
          push_options: --force-with-lease
